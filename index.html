  <body class="finder-page">
    <nav class="topbar" aria-label="サイト内ナビゲーション">
      <div class="topbar-inner">
        <a class="brand" href="./">
          <span class="brand-mark">関</span>
          <span>

            <small>イベント・遊び場データベース</small>

        </div>
      </div>

    <header class="app-header">
      <div class="hero-inner">
        <div class="app-header__main">
          <h1>日程・地域・年齢から、<br>関東のおでかけを探す。</h1>
          <p class="lead">群馬を中心に、栃木・茨城・埼玉のおでかけ情報を掲載。</p>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar" aria-label="絞り込み">
        <section class="filter-panel">
          <div class="filter-title">
            <h2><i class="ui-icon ui-icon--sliders" aria-hidden="true"></i>絞り込み</h2>
            <div class="filter-actions">
              <button id="filterToggleButton" class="ghost-button filter-toggle" type="button" aria-expanded="false"><i class="ui-icon ui-icon--sliders" aria-hidden="true"></i>詳しい条件</button>
              <button id="resetButton" class="ghost-button" type="button"><i class="ui-icon ui-icon--rotate" aria-hidden="true"></i>リセット</button>
            </div>
          </div>

          <div class="mode-switch" role="group" aria-label="表示データ">
            <button id="modeEventsButton" class="mode-button is-active" type="button" data-mode="events"><i class="ui-icon ui-icon--ticket" aria-hidden="true"></i>イベント</button>
            <button id="modePlacesButton" class="mode-button" type="button" data-mode="places"><i class="ui-icon ui-icon--play" aria-hidden="true"></i>遊び場</button>
          </div>

          <div class="filter-primary">
            <label class="field">
              <span><i class="ui-icon ui-icon--search" aria-hidden="true"></i>キーワードで探す</span>
              <input id="searchInput" type="search" placeholder="イベント名・施設名・地域">
            </label>
            <div class="location-fields">
              <label class="field">
                <span><i class="ui-icon ui-icon--map" aria-hidden="true"></i>都県</span>
                <select id="prefectureSelect"></select>
              </label>
              <label class="field">
                <span><i class="ui-icon ui-icon--pin" aria-hidden="true"></i>市町村</span>
                <select id="municipalitySelect"></select>
              </label>
            </div>
          </div>

          <div id="filterBody" class="filter-body">
            <label class="field">
              <span><i class="ui-icon ui-icon--users" aria-hidden="true"></i>年代</span>
              <select id="ageSelect"></select>
            </label>

            <label class="field">
              <span id="categoryFieldLabel"><i class="ui-icon ui-icon--tag" aria-hidden="true"></i>カテゴリ</span>
              <select id="categorySelect"></select>
            </label>
          </div>
        </section>
      </aside>

      <section class="content">
        <div class="results-heading">
          <div class="results-heading__title">
            <h2 id="resultsTitle">イベント</h2>
            <p id="resultCount" class="result-count" aria-live="polite"></p>
            <p id="dataUpdated" class="data-updated"></p>
          </div>
          <label class="sort-control"><span>並び替え</span><select id="sortSelect" aria-label="検索結果の並び替え"></select></label>
        </div>
        <div class="quick-filters">
          <div class="quick-filter-section">
            <span class="quick-filter-label">日程</span>
            <div id="dateChips" class="chip-row" role="group" aria-label="日程でしぼり込み"></div>
          </div>
          <div class="quick-filter-section">
            <span id="decisionLabel" class="quick-filter-label">こだわり</span>
            <div id="decisionChips" class="chip-row decision-chips" role="group" aria-label="こだわりでしぼり込み"></div>
            <p class="filter-note">「無料」は一部有料などの条件付きも含みます。年齢は掲載文から判定し、年齢制限なしも含みます。詳細は公式情報をご確認ください。</p>
          </div>
          <div id="ageChips" class="chip-row" role="group" aria-label="年代でしぼり込み" hidden></div>
          <div id="categoryChips" class="chip-row" role="group" aria-label="カテゴリでしぼり込み" hidden></div>
          <div id="listContext" class="list-context" aria-label="適用中の条件" hidden></div>
        </div>

        <div id="eventList" class="event-list"></div>
      </section>
