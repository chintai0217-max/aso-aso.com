    <main class="app-shell">
      <aside class="sidebar" aria-label="絞り込み">
        <section class="filter-panel">
          <div class="filter-title">
            <h2>絞り込み</h2>
            <div class="filter-actions">
              <button id="filterToggleButton" class="ghost-button filter-toggle" type="button" aria-expanded="false">条件</button>
              <button id="resetButton" class="ghost-button" type="button">リセット</button>
            </div>
          </div>

          <div class="mode-switch" role="group" aria-label="表示データ">
            <button id="modeEventsButton" class="mode-button is-active" type="button" data-mode="events">イベント</button>
            <button id="modePlacesButton" class="mode-button" type="button" data-mode="places">遊び場</button>
          </div>

          <div id="filterBody" class="filter-body">
            <label class="field">
              <span>キーワード</span>
              <input id="searchInput" type="search" placeholder="イベント名・会場・概要">
            </label>

            <label class="field">
              <span>市町村</span>
              <select id="municipalitySelect"></select>
            </label>

            <label class="field">
              <span id="categoryFieldLabel">カテゴリ</span>
              <select id="categorySelect"></select>
            </label>

          </div>
        </section>

        <section class="coverage-panel">
          <h2>地域からさがす</h2>
          <div id="coverageList" class="coverage-list"></div>
        </section>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div>
            <p class="results-label">検索結果</p>
            <h2 id="resultCount">-件</h2>
          </div>
          <div class="toolbar-actions">
            <button id="sortDateButton" class="icon-button is-active" type="button" title="日付順">日付順</button>
            <button id="sortAreaButton" class="icon-button" type="button" title="地域順">地域順</button>
          </div>
        </div>

        <div class="quick-filters">
          <div id="dateChips" class="chip-row" role="group" aria-label="日程でしぼり込み"></div>
          <div id="categoryChips" class="chip-row" role="group" aria-label="カテゴリでしぼり込み"></div>
        </div>

        <div id="insights" class="insights" aria-label="注目情報"></div>
        <div id="eventList" class="event-list"></div>
      </section>
    </main>

    <dialog id="eventDialog" class="event-dialog">
      <button id="closeDialog" class="dialog-close" type="button" aria-label="閉じる">×</button>
      <div id="dialogBody"></div>
    </dialog>

    <script src="./config.js"></script>
    <script src="./data/events.js"></script>
    <script src="./app.js"></script>
